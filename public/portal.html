<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portail Patient - Sera</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #f5f7fa; color: #333; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h1 { font-size: 24px; margin-bottom: 8px; color: #1a73e8; }
  h2 { font-size: 18px; margin-bottom: 16px; color: #444; }
  .hidden { display: none; }
  input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1557b0; }
  .logout-btn { background: transparent; color: #666; float: right; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
  th { color: #666; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-scheduled { background: #e8f0fe; color: #1a73e8; }
  .badge-completed { background: #e6f4ea; color: #137333; }
  .badge-cancelled { background: #fce8e6; color: #c5221f; }
  .error { color: #c5221f; background: #fce8e6; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
  .info { color: #1a73e8; background: #e8f0fe; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="card" id="loginSection">
    <h1>Portail Patient</h1>
    <p style="color:#666;margin-bottom:16px">Connectez-vous pour voir vos rendez-vous, factures et traitements.</p>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password">
    <button onclick="login()">Se connecter</button>
    <div id="loginError" class="error hidden"></div>
  </div>

  <div id="portalSection" class="hidden">
    <div class="card">
      <button class="logout-btn" onclick="logout()">Déconnexion</button>
      <h1>Portail Patient</h1>
      <p style="color:#666">Bienvenue, <span id="patientName"></span></p>
    </div>

    <div class="card">
      <h2>Mes Rendez-vous</h2>
      <div id="appointmentsContent"><p style="color:#999">Chargement...</p></div>
    </div>

    <div class="card">
      <h2>Mes Factures</h2>
      <div id="invoicesContent"><p style="color:#999">Chargement...</p></div>
    </div>

    <div class="card">
      <h2>Mon Historique de Traitements</h2>
      <div id="treatmentsContent"><p style="color:#999">Chargement...</p></div>
    </div>
  </div>
</div>

<script>
const API = '/api/v1';
let token = null;
let user = null;

async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.classList.add('hidden');

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');

    token = data.accessToken;
    user = data;

    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('portalSection').classList.remove('hidden');
    document.getElementById('patientName').textContent = data.fullName || email;

    loadPatientData();
  } catch (err) {
    errorEl.textContent = 'Erreur de connexion: ' + err.message;
    errorEl.classList.remove('hidden');
  }
}

function logout() {
  token = null;
  user = null;
  document.getElementById('loginSection').classList.remove('hidden');
  document.getElementById('portalSection').classList.add('hidden');
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

function authHeaders() {
  return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
}

async function loadPatientData() {
  loadAppointments();
  loadInvoices();
  loadTreatments();
}

async function loadAppointments() {
  const el = document.getElementById('appointmentsContent');
  try {
    const res = await fetch(`${API}/appointments?patient_id=${user.id}`, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const appointments = Array.isArray(data) ? data : (data.appointments || []);
    if (appointments.length === 0) {
      el.innerHTML = '<p style="color:#999">Aucun rendez-vous trouvé.</p>';
      return;
    }
    el.innerHTML = `<table><tr><th>Date</th><th>Motif</th><th>Statut</th></tr>${appointments.map(a => `
      <tr>
        <td>${new Date(a.appointment_date || a).toLocaleDateString('fr-DZ')}</td>
        <td>${a.reason || 'Consultation'}</td>
        <td><span class="badge badge-${(a.status_key || '').replace('appt.status.', '')}">${(a.status_key || '').replace('appt.status.', '')}</span></td>
      </tr>`).join('')}</table>`;
  } catch (err) {
    el.innerHTML = `<div class="error">Erreur: ${err.message}</div>`;
  }
}

async function loadInvoices() {
  const el = document.getElementById('invoicesContent');
  try {
    const res = await fetch(`${API}/invoices?patient_id=${user.id}`, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const invoices = Array.isArray(data) ? data : [];
    if (invoices.length === 0) {
      el.innerHTML = '<p style="color:#999">Aucune facture trouvée.</p>';
      return;
    }
    el.innerHTML = `<table><tr><th>N° Facture</th><th>Date</th><th>Total (DZD)</th><th>Statut</th></tr>${invoices.map(inv => `
      <tr>
        <td>${inv.invoice_number || inv.id?.slice(0,8)}</td>
        <td>${new Date(inv.invoice_date || inv.created_at).toLocaleDateString('fr-DZ')}</td>
        <td>${(inv.total_dzd || 0).toLocaleString()}</td>
        <td>${(inv.status_key || '').replace('invoice.status.', '')}</td>
      </tr>`).join('')}</table>`;
  } catch (err) {
    el.innerHTML = `<div class="error">Erreur: ${err.message}</div>`;
  }
}

async function loadTreatments() {
  const el = document.getElementById('treatmentsContent');
  try {
    const res = await fetch(`${API}/treatments?patient_id=${user.id}`, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const treatments = Array.isArray(data) ? data : [];
    if (treatments.length === 0) {
      el.innerHTML = '<p style="color:#999">Aucun traitement trouvé.</p>';
      return;
    }
    el.innerHTML = `<table><tr><th>Date</th><th>Diagnostic</th><th>Traitement</th><th>Coût (DZD)</th></tr>${treatments.map(t => `
      <tr>
        <td>${new Date(t.treatment_date).toLocaleDateString('fr-DZ')}</td>
        <td>${t.diagnosis || '-'}</td>
        <td>${t.treatment_performed || '-'}</td>
        <td>${(t.estimated_cost_dzd || 0).toLocaleString()}</td>
      </tr>`).join('')}</table>`;
  } catch (err) {
    el.innerHTML = `<div class="error">Erreur: ${err.message}</div>`;
  }
}
</script>
</body>
</html>
