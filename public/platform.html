<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sera Platform</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script src="site.js"></script>
<script src="platform.js"></script>
<style>
  /* ---- instrument-datasheet console rework (mirrors website/style.css) ---- */
  .sheet { width: min(1160px, 100%); }

  body {
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* brand header */
  .brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand .mark { width: 26px; height: 26px; color: var(--primary); align-self: center; flex-shrink: 0; }
  .wordmark { font-family: 'Fira Code', monospace; font-weight: 500; font-size: 1.05rem;
              letter-spacing: .12em; text-transform: lowercase; }
  .brand .rule { width: 1px; height: 22px; background: var(--line-strong); align-self: center; }
  h1 { font-size: clamp(1.2rem, 2.6vw, 1.5rem); font-weight: 700; letter-spacing: -.02em; }

  /* index tabs */
  .tabs { display: flex; gap: 0; margin: 26px 0 20px; border-bottom: 1px solid var(--line-strong); }
  .tab {
    border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--muted);
    padding: 10px 22px; cursor: pointer; font: inherit; font-size: .95rem;
    font-weight: 500; transition: color .12s, border-color .12s; margin-bottom: -1px;
  }
  .tab:hover { color: var(--primary); }
  .tab.on { color: var(--primary); border-bottom-color: var(--primary); }
  .tab .idx { font-family: 'Fira Code', monospace; font-size: .68rem; margin-inline-end: 8px; opacity: .7; }

  .logout {
    border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
    font-family: 'Fira Code', monospace; font-size: .68rem; letter-spacing: .08em;
    padding: 8px 11px; border-radius: 0; cursor: pointer; transition: color .12s, border-color .12s;
  }
  .logout:hover { color: var(--primary); border-color: var(--primary); }

  /* stat devices */
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0;
           border: 1px solid var(--line-strong); background: var(--card); }
  .stat { padding: 18px 18px 16px; border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line);
          position: relative; }
  .stat::before { content:''; position:absolute; top:0; inset-inline-start:0; width:22px; height:2px;
                  background: var(--line-strong); transition: background .15s, width .15s; }
  .stat:hover::before { background: var(--primary); width: 44px; }
  .stat .k { font-family: 'Fira Code', monospace; font-size: .64rem; letter-spacing: .12em;
             text-transform: uppercase; color: var(--muted); }
  .stat .v { font-family: 'Fira Code', monospace; font-size: 1.9rem; font-weight: 500;
             color: var(--ink); margin-top: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; }

  .section-label { font-family:'Fira Code',monospace; font-size:.72rem; color:var(--muted);
                   letter-spacing:.1em; margin:30px 0 12px; text-transform: uppercase;
                   padding-bottom: 8px; border-bottom: 1px solid var(--line);
                   display: flex; align-items: baseline; gap: 10px; position: relative; }
  .section-label::before { content:''; position: absolute; inset-inline-start: -14px; top: -2px;
                        width: 7px; height: 7px; border-top: 1px solid var(--primary);
                        border-inline-start: 1px solid var(--primary); }
  .section-label b { color: var(--primary); font-weight: 500; }

  /* ledger tables */
  .tbl-wrap { background: var(--card); border: 1px solid var(--line-strong); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { font-family: 'Fira Code', monospace; font-size: .62rem; letter-spacing: .12em; text-transform: uppercase;
       color: var(--muted); text-align: start; font-weight: 400; padding: 11px 14px;
       border-bottom: 1px solid var(--line-strong); background: color-mix(in srgb, var(--muted) 6%, transparent); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: background .1s, box-shadow .1s; }
  tbody tr:hover { background: color-mix(in srgb, var(--primary) 5%, transparent);
                   box-shadow: inset 2px 0 0 var(--primary); }
  td.num, .num { font-family: 'Fira Code', monospace; font-size: .8rem; font-variant-numeric: tabular-nums; }
  td b { font-weight: 600; }

  .pill { display: inline-flex; align-items: center; gap: 6px; font-family: 'Fira Code', monospace;
          font-size: .64rem; letter-spacing: .08em; text-transform: uppercase;
          padding: 3px 9px; border: 1px solid var(--line-strong); color: var(--muted); border-radius: 0; }
  .pill::before { content:''; width: 6px; height: 6px; border-radius: 50%;
                  background: var(--muted); flex-shrink: 0; }
  .pill.active   { color: #15803d; border-color: #86efac; }
  .pill.active::before   { background: #22c55e; }
  .pill.trial    { color: #1d4ed8; border-color: #93c5fd; }
  .pill.trial::before    { background: #3b82f6; }
  .pill.suspended, .pill.cancelled, .pill.expired { color: #b91c1c; border-color: #fca5a5; }
  .pill.suspended::before, .pill.cancelled::before, .pill.expired::before { background: #ef4444; }
  [data-theme="dark"] .pill.active   { color: #4ade80; border-color: #166534; }
  [data-theme="dark"] .pill.trial    { color: #93c5fd; border-color: #1e3a8a; }
  [data-theme="dark"] .pill.suspended, [data-theme="dark"] .pill.cancelled, [data-theme="dark"] .pill.expired { color: #fca5a5; border-color: #7f1d1d; }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input[type="text"], .toolbar input[type="search"] {
    width: min(320px, 100%); border: 1px solid var(--line-strong); border-radius: 0;
    padding: 9px 12px; font: inherit; font-size: .9rem; color: var(--ink); background: var(--card);
  }
  .toolbar input:focus { outline: none; border-color: var(--primary); }
  .toolbar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line-strong); background: var(--card); color: var(--muted);
    padding: 6px 13px; border-radius: 0; cursor: pointer; font: inherit; font-size: .76rem;
    font-family: 'Fira Code', monospace; letter-spacing: .05em;
    transition: border-color .12s, background .12s, color .12s;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

  .pager { display: flex; align-items: center; gap: 12px; justify-content: flex-end; margin-top: 12px; }
  .pager button {
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 0; cursor: pointer; font: inherit; font-size: .85rem;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager button:not(:disabled):hover { border-color: var(--primary); color: var(--primary); }
  .pager .note { align-self: center; }

  /* detail */
  .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .back { border: none; background: transparent; color: var(--primary); font: inherit; font-size: .88rem;
          cursor: pointer; padding: 0; }
  .back:hover { text-decoration: underline; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 18px; }
  @media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
  .grid2 .card { border-radius: 0; border-top: 2px solid var(--primary); }
  select {
    width: 100%; border: 1px solid var(--line-strong); border-radius: 0;
    padding: 11px 13px; font: inherit; font-size: .95rem; color: var(--ink); background: var(--card);
  }
  select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .save-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .ok-msg { color: #15803d; font-size: .85rem; font-family: 'Fira Code', monospace; }
  [data-theme="dark"] .ok-msg { color: #4ade80; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .92rem; }
  .kv dt { font-size: .66rem; align-self: center; }
  .kv dd { font-weight: 500; overflow-wrap: anywhere; }

  /* login */
  #login { display: flex; justify-content: center; padding-top: 9vh; }
  #login .card { width: min(400px, 100%); border-radius: 0; border-top: 2px solid var(--primary); }
  #login h1 { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="sheet">

  <header class="head">
    <div class="brand">
      <svg class="mark" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="currentColor"><g transform="translate(4.8,4.8) scale(0.15)"><path d="M 268.32554 4.4726216 C 202.01816 1.3492603 133.77995 23.549043 79.516378 75.964191 C -78.193147 228.30154 14.3336 488.94189 234.28797 511.94002 C 402.2524 529.50214 544.94832 372.50758 510.13529 208.45237 C 483.98551 85.222448 378.83785 9.6782238 268.32554 4.4726216 z M 258.73799 292.75773 C 308.17368 293.27499 357.53892 311.28546 397.30776 346.69297 C 414.23674 361.76539 414.1738 360.818 399.36196 376.99318 C 365.71056 413.74198 323.59346 435.08974 275.80784 439.62113 C 211.91236 445.68017 149.13554 419.20695 108.89568 369.23654 C 101.25056 359.74273 101.235 359.77371 119.75189 343.78763 C 159.79748 309.21522 209.3023 292.24048 258.73799 292.75773 z " transform="matrix(0.49726755,0,0,0.50284557,-0.29677367,-2.1045067)"/></g></svg>
      <span class="wordmark">sera</span>
      <span class="rule" aria-hidden="true"></span>
      <h1 data-i="title">Sera Operator Console</h1>
    </div>
    <div class="controls" id="headerControls" style="visibility:hidden">
      <div class="lang-group" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-l="en">EN</button>
        <button type="button" class="lang-btn" data-l="fr">FR</button>
        <button type="button" class="lang-btn" data-l="ar">ع</button>
      </div>
      <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch color theme">
        <svg class="icon-sun" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18C8.68629 18 6 15.3137 6 12C6 8.68629 8.68629 6 12 6C15.3137 6 18 8.68629 18 12C18 15.3137 15.3137 18 12 18ZM12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.51472 4.92893L4.92893 3.51472L7.05025 5.63604L5.63604 7.05025L3.51472 4.92893ZM16.9497 18.364L18.364 16.9497L20.4853 19.0711L19.0711 20.4853L16.9497 18.364ZM19.0711 3.51472L20.4853 4.92893L18.364 7.05025L16.9497 5.63604L19.0711 3.51472ZM5.63604 16.9497L7.05025 18.364L4.92893 20.4853L3.51472 19.0711L5.63604 16.9497ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/></svg>
        <svg class="icon-moon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6C10 10.4183 13.5817 14 18 14C19.4386 14 20.7885 13.6203 21.9549 12.9556C21.4738 18.0302 17.2005 22 12 22C6.47715 22 2 17.5228 2 12C2 6.79948 5.9698 2.52616 11.0444 2.04507C10.3797 3.21152 10 4.56142 10 6Z"/></svg>
      </button>
      <button type="button" class="logout" id="logoutBtn" data-i="logout" style="visibility:hidden">Log out</button>
    </div>
  </header>

  <!-- login -->
  <main id="login">
    <div class="card">
      <p class="kicker" data-i="kicker">Platform</p>
      <p data-i="login_lede">Operator access only.</p>
      <label for="email" data-i="email">Email</label>
      <input id="email" dir="ltr" type="email" autocomplete="username">
      <label for="password" data-i="password">Password</label>
      <input id="password" dir="ltr" type="password" autocomplete="current-password">
      <div class="actions">
        <button class="btn" id="loginBtn" data-i="signin">Sign in</button>
      </div>
      <div class="msg err hidden" id="loginErr"></div>
    </div>
  </main>

  <!-- app -->
  <main id="app" class="hidden">
    <div class="tabs">
      <button type="button" class="tab on" id="tabOverview"><span class="idx">01</span><span data-i="tab_overview">Overview</span></button>
      <button type="button" class="tab" id="tabClinics"><span class="idx">02</span><span data-i="tab_clinics">Clinics</span></button>
    </div>

    <!-- overview -->
    <section id="viewOverview">
      <div class="stats" id="statGrid"></div>
      <p class="section-label"><b>01</b><span data-i="recent_signups">Recent signups</span></p>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th data-i="th_clinic">Clinic</th>
              <th data-i="th_address">Address</th>
              <th data-i="th_status">Status</th>
              <th data-i="th_created">Created</th>
            </tr>
          </thead>
          <tbody id="recentBody"></tbody>
        </table>
      </div>
    </section>

    <!-- clinics -->
    <section id="viewClinics" class="hidden">
      <div class="toolbar">
        <input type="search" id="search" data-i-ph="search_ph" placeholder="Search name or address…">
        <div class="chips" id="statusChips"></div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th data-i="th_clinic">Clinic</th>
              <th data-i="th_address">Address</th>
              <th data-i="th_status">Status</th>
              <th data-i="th_plan">Plan</th>
              <th data-i="th_users">Users</th>
              <th data-i="th_patients">Patients</th>
              <th data-i="th_appts">Appts</th>
              <th data-i="th_created">Created</th>
            </tr>
          </thead>
          <tbody id="tenantsBody"></tbody>
        </table>
      </div>
      <div class="pager">
        <span class="note" id="pagerInfo"></span>
        <button type="button" id="prevBtn" data-i="prev">‹ Prev</button>
        <button type="button" id="nextBtn" data-i="next">Next ›</button>
      </div>
    </section>

    <!-- tenant detail -->
    <section id="viewDetail" class="hidden">
      <div class="detail-head">
        <button type="button" class="back" id="backBtn">← <span data-i="back">Back to clinics</span></button>
        <span class="pill" id="detailPill"></span>
      </div>
      <div class="grid2">
        <div class="card">
          <p class="section-label" style="margin-top:0"><b>01</b><span data-i="subscription">Subscription</span></p>
          <label for="editStatus" data-i="th_status">Status</label>
          <select id="editStatus"></select>
          <label for="editPlan" data-i="th_plan">Plan</label>
          <input id="editPlan" dir="ltr" placeholder="starter / clinic / enterprise">
          <label for="editEnds" data-i="trial_ends">Trial / subscription ends</label>
          <input id="editEnds" dir="ltr" type="date">
          <div class="save-row">
            <button class="btn" id="saveBtn" data-i="save">Save</button>
            <span class="ok-msg hidden" id="saveOk" data-i="saved">Saved ✓</span>
          </div>
          <div class="msg err hidden" id="detailErr"></div>
        </div>
        <div class="card">
          <p class="section-label" style="margin-top:0"><b>02</b><span data-i="clinic_info">Clinic</span></p>
          <dl class="kv" id="detailInfo"></dl>
        </div>
      </div>
      <p class="section-label"><b>03</b><span data-i="team">Team</span></p>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th data-i="name">Name</th>
              <th data-i="email">Email</th>
              <th data-i="th_role">Role</th>
              <th data-i="th_status">Status</th>
              <th data-i="th_lastlogin">Last login</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <span>sera · <span data-i="footer">operator console · internal use</span></span>
    <span class="note mono" id="sheetRef">OP-CONSOLE</span>
  </footer>
</div>

</body>
</html>
