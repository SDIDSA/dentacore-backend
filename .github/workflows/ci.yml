name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dentacore_test
          POSTGRES_USER: dentacore
          POSTGRES_PASSWORD: dentacore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema (db.sql)
        run: PGPASSWORD=dentacore_test psql -h localhost -U dentacore -d dentacore_test -v ON_ERROR_STOP=1 -f db.sql

      - name: Apply seed (seed.sql)
        run: PGPASSWORD=dentacore_test psql -h localhost -U dentacore -d dentacore_test -v ON_ERROR_STOP=1 -f seed.sql

      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dentacore_test
          DB_USER: dentacore
          DB_PASSWORD: dentacore_test
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-jwt-refresh-secret
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
